# PromptAudit 3.0

debug_raw_outputs: false  # Include raw prompts and replies in the run log

performance:
  # Only Ollama supports more than one worker.
  inference_workers: 1

  # Reuse identical successful requests on this computer.
  response_cache: true
  cache_root: results/cache
  # Ollama cross-run reuse needs a profile and an explicit context window.
  cache_profile: ""

  # Collect predictions now and run saved-result analysis later.
  defer_analysis: false

  # Keep the current model loaded between conditions.
  cache_models: true

  cache_prompts: true

  # Save verbose logs to debug.log in the run folder.
  save_debug_log: false

  # Save Standard progress after this many samples or seconds.
  checkpoint_every_n_samples: 10
  checkpoint_every_seconds: 15.0
  progress_every_n_samples: 10

  # Windows can keep the system awake while letting the display sleep.
  prevent_system_sleep: true
  keep_display_awake: false

  # Optional delay between self-consistency draws.
  sc_vote_delay_seconds: 0.0

  ollama_keep_alive: 30m

# Saved-result analysis. These settings do not change model requests.
analysis:
  enabled: true
  bootstrap_resamples: 1000
  group_by: cve_id
  paired_comparisons: true
  rankings: true
  prevalence: true
  prevalence_size: 1000
  prevalence_repeats: 20
  output_audit: true
  dataset_audit: true
  review_case_limit: 50

generation:
  temperature: 0.2
  top_p: 0.9
  top_k: 40
  # Maximum answer length. Set context_window separately for Ollama.
  max_new_tokens: 1024
  repetition_penalty: 1.0
  # Frequency and presence penalties apply to the completion API.
  frequency_penalty: 0.0
  presence_penalty: 0.0
  num_beams: 1
  sc_samples: 5
  seed: 42
  stop_sequences: []
  experiment_name: "Default Run"
  experiment_notes: ""

output:
  results_csv: results/csv/metrics.csv

  report_html: results/report.html

  run_root: results/runs

models:
  # The dummy backend is for pilots.
  - name: dummy
    backend: dummy

  # Names must match the installed Ollama tags.
  - name: mistral:latest
    backend: ollama
    context_window: 32768

  - name: gemma:7b
    backend: ollama
    context_window: 8192

  - name: codellama:7b-instruct
    backend: ollama
    context_window: 16384

  # The checkpoint has a 2K context, so cap the answer at 512.
  - name: falcon:7b-instruct
    backend: ollama
    context_window: 2048
    max_new_tokens: 512

  - name: deepseek-coder:6.7b-instruct
    backend: ollama
    context_window: 16384

  - name: qwen3-coder:30b
    backend: ollama
    context_window: 32768

prompts:
  - zero_shot         # Single-pass classification, no examples
  - few_shot          # Uses small labeled examples in the prompt
  - cot               # Chain-of-thought style reasoning
  - adaptive_cot      # Chooses when to use CoT based on context
  - self_consistency  # Multiple sampled chains with voting
  - self_verification # Adds a self-check step before the final verdict

ablations:
  available_output_protocols: [verdict_first, verdict_last]
  default_output_protocols: [verdict_first]
  available_parser_modes: [strict, structured, full]
  default_parser_modes: [full]

datasets:
  # Small mixed-language function-level dataset for smoke tests and demos.
  - name: toy
    source: local
    path: data/toy.csv

  # Local CVEFixes cohorts; CSVs preserve the existing folder-loader selections.
  - name: cvefixes_50
    source: local
    path: data/cvefixes/cvefixes_50.csv.gz

  - name: cvefixes_100
    source: local
    path: data/cvefixes/cvefixes_100.csv.gz

  - name: cvefixes_500
    source: local
    path: data/cvefixes/cvefixes_500.csv.gz

  - name: cvefixes_1000
    source: local
    path: data/cvefixes/cvefixes_1000.csv.gz

  # BigVul suffixes count CVEs. Each CVE can have several code samples.
  - name: bigvul_50
    source: local
    path: data/bigvul/bigvul_50.csv

  - name: bigvul_100
    source: local
    path: data/bigvul/bigvul_100.csv

  - name: bigvul_500
    source: local
    path: data/bigvul/bigvul_500.csv

  - name: bigvul_1000
    source: local
    path: data/bigvul/bigvul_1000.csv

  # Hugging Face-backed datasets (loaded by name in the loader).
  - name: bigvul
    source: hf

  - name: vul4j
    source: hf

# Optional completion API
api:
  api_host: https://api.openai.com
  # Set PROMPTAUDIT_API_KEY or OPENAI_API_KEY in your environment.
  api_key: ""
